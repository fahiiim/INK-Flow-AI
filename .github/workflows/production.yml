name: AI service CI and production deployment

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ink-flow-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run test suite
        run: python -m pytest --quiet

  container:
    name: Validate container build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        run: docker build --tag tattoo-hysteria-ai:ci .

  deploy:
    name: Deploy to EC2
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${SSH_KNOWN_HOSTS}"
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" \
            | tr -d '\r' > "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" \
            > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Bootstrap exact EC2 checkout
        env:
          DEPLOY_SHA: ${{ github.sha }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          test -n "${EC2_HOST}"
          test -n "${EC2_SSH_PORT}"
          test -n "${EC2_USER}"
          bundle_path="${RUNNER_TEMP}/ink-flow-ai.bundle"
          remote_bundle="/tmp/ink-flow-ai-${DEPLOY_SHA}.bundle"
          git bundle create "${bundle_path}" HEAD
          ssh \
            -i "${HOME}/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "${EC2_SSH_PORT}" \
            "${EC2_USER}@${EC2_HOST}" \
            "sudo install -d -o '${EC2_USER}' -g '${EC2_USER}' \
            -m 755 /opt/tattoo-hysteria-ai"
          scp \
            -i "${HOME}/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -P "${EC2_SSH_PORT}" \
            "${bundle_path}" \
            "${EC2_USER}@${EC2_HOST}:${remote_bundle}"
          ssh \
            -i "${HOME}/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "${EC2_SSH_PORT}" \
            "${EC2_USER}@${EC2_HOST}" \
            "BUNDLE_PATH='${remote_bundle}' DEPLOY_SHA='${DEPLOY_SHA}' \
            bash -s" <<'REMOTE'
          set -Eeuo pipefail
          readonly app_directory="/opt/tattoo-hysteria-ai"
          trap 'rm -f "${BUNDLE_PATH}"' EXIT
          if [[ ! -d "${app_directory}/.git" ]]; then
              if [[ -n "$(
                  find "${app_directory}" \
                      -mindepth 1 -maxdepth 1 -print -quit
              )" ]]; then
                  echo "AI directory exists but is not an empty Git checkout." >&2
                  exit 1
              fi
              git clone "${BUNDLE_PATH}" "${app_directory}"
          fi
          cd "${app_directory}"
          if [[ -n "$(git status --porcelain)" ]]; then
              echo "AI checkout contains local changes." >&2
              exit 1
          fi
          git fetch "${BUNDLE_PATH}" HEAD
          git checkout --detach --force FETCH_HEAD
          if [[ "$(git rev-parse HEAD)" != "${DEPLOY_SHA}" ]]; then
              echo "EC2 checkout does not match the workflow commit." >&2
              exit 1
          fi
          REMOTE

      - name: Provision production environment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "${EC2_HOST}"
          test -n "${EC2_SSH_PORT}"
          test -n "${EC2_USER}"
          test -n "${OPENAI_API_KEY}"
          {
            printf 'OPENAI_API_KEY=%s\n' "${OPENAI_API_KEY}"
            printf 'OPENAI_TEMPERATURE=0.0\n'
            printf 'OPENAI_TIMEOUT_SECONDS=30\n'
            printf 'OPENAI_MAX_RETRIES=2\n'
          } | ssh \
            -i "${HOME}/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "${EC2_SSH_PORT}" \
            "${EC2_USER}@${EC2_HOST}" \
            "set -eu; umask 077; \
            cat > /opt/tattoo-hysteria-ai/.env.next; \
            chmod 600 /opt/tattoo-hysteria-ai/.env.next; \
            mv /opt/tattoo-hysteria-ai/.env.next \
            /opt/tattoo-hysteria-ai/.env"

      - name: Update the AI service only
        env:
          DEPLOY_SHA: ${{ github.sha }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          test -n "${EC2_HOST}"
          test -n "${EC2_SSH_PORT}"
          test -n "${EC2_USER}"
          ssh \
            -i "${HOME}/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "${EC2_SSH_PORT}" \
            "${EC2_USER}@${EC2_HOST}" \
            "DEPLOY_SHA=${DEPLOY_SHA} bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/tattoo-hysteria-ai
          if [[ "$(git rev-parse HEAD)" != "${DEPLOY_SHA}" ]]; then
              echo "EC2 checkout does not match the workflow commit." >&2
              exit 1
          fi
          bash scripts/deploy-production.sh
          REMOTE
