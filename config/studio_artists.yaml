config_version: 1
artists:
  - artist_key: nina
    display_name: Nina
    specialties:
      - fine-line
      - geometric
    profile_summary: >-
      Nina is an architect and interior designer with a master's degree in
      Interior Design Science from Politecnica Design University in Milan.
      Her tattoo work focuses on identity, meaningful personal narratives,
      self-expression, and creating a thoughtful, transformative experience.
    min_size_cm: 2.0
    max_size_cm: 15.0
    is_active: true

  - artist_key: hoss
    display_name: Hoss
    specialties:
      - watercolor
      - traditional
      - black-and-grey
    profile_summary: >-
      Hoss has tattooed professionally since 2005 and accepts traditional,
      black-and-grey, and watercolor projects. His signature work blends
      surreal graphic imagery, geometry, and watercolor. He works closely
      with clients to translate personal stories and meaningful intentions
      into custom tattoos, and he welcomes first-time clients.
    min_size_cm: 8.0
    max_size_cm: null
    is_active: true

  - artist_key: lana
    display_name: Lana
    specialties:
      - fine-line
      - floral
    profile_summary: >-
      Lana specializes in delicate fine-line and botanical tattoos in both
      black and color. She often works freehand so designs flow naturally
      with the body, drawing on emotions, memories, nature, and personal
      stories.
    min_size_cm: 3.0
    max_size_cm: 18.0
    is_active: true

  - artist_key: sliva
    display_name: Silva
    specialties:
      - calligraphy
      - geometric
      - black-and-grey
    profile_summary: >-
      Silva combines clean pixel geometry with vibrant color, natural forms,
      video-game aesthetics, glitch effects, and a touch of psychedelia. He
      takes an empathetic, easygoing approach and adapts each design through
      his own precise, playful visual style.
    min_size_cm: 4.0
    max_size_cm: 25.0
    is_active: true

  - artist_key: sandra
    display_name: Sandra
    specialties:
      - black-and-grey
    profile_summary: >-
      Sandra is a Latvian artist based in Amsterdam with a background in
      traditional art and leather design. Her tattoos are abstract, dark,
      expressive, and created exclusively in black ink, with clean, bold
      compositions designed to flow naturally with the body.
    min_size_cm: 2.0
    max_size_cm: 20.0
    is_active: true
